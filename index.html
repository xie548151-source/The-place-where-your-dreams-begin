<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The place where your dreams begin...</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ececec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .stage-container {
            display: none;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }
        .active-stage {
            display: block;
        }
        .email-box {
            background-color: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            font-family: monospace;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .email-header {
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #aaa;
            font-size: 14px;
            text-align: left;
        }
        .email-body {
            color: #00ff66;
            text-shadow: 0 0 5px rgba(0,255,102,0.3);
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
        }
        .phone-bg {
            background-color: #8c9bb0;
            border-radius: 20px;
            padding: 25px 15px;
            height: 450px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 4px solid #333;
            position: relative;
        }
        .line-time {
            align-self: center;
            background: rgba(0,0,0,0.1);
            color: #fff;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .line-msg-wrapper {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .line-avatar {
            width: 40px;
            height: 40px;
            background-color: #555;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
        }
        .line-chat-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .line-name {
            color: #fff;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .line-bubble {
            background-color: #fff;
            color: #1c1c1c;
            padding: 10px 14px;
            border-radius: 0 14px 14px 14px;
            font-size: 14px;
            max-width: 260px;
            line-height: 1.5;
            text-align: left;
            word-break: break-all;
        }
        .action-btn {
            background: #333;
            border: 1px solid #666;
            color: #fff;
            padding: 12px;
            width: 100%;
            font-size: 15px;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #444;
        }
        .monologue-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .monologue-box {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 12px;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            animation: fadeIn 0.4s ease;
        }
        .monologue-text {
            font-size: 16px;
            color: #e0e0e0;
            margin: 0 0 20px 0;
            line-height: 1.8;
            letter-spacing: 0.5px;
            text-align: left;
            white-space: pre-line;
        }
        .monologue-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #bbb;
            padding: 10px 25px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        .monologue-btn:hover {
            border-color: #ff4b4b;
            color: #ff4b4b;
        }
        .error-container {
            display: none;
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }
        h1 {
            font-size: 72px;
            margin: 0 0 10px 0;
            color: #ff4b4b;
            letter-spacing: 2px;
        }
        p {
            font-size: 18px;
            color: #888;
            margin-bottom: 15px;
        }
        .info-text {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
        }
        .hidden-trigger-btn {
            display: none;
            margin-top: 50px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.12);
            font-size: 11px;
            cursor: pointer;
            outline: none;
        }
        .hidden-trigger-btn:hover {
            color: rgba(255, 255, 255, 0.35);
        }
        #mainWebsite {
            display: none;
            background-color: #151518;
            border: 2px solid #d4af37;
            padding: 40px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
            text-align: center;
        }
        .vip-title {
            color: #d4af37;
            font-family: "Times New Roman", serif;
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .vip-subtitle {
            color: #777;
            font-size: 12px;
            margin-bottom: 30px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            background-color: #222;
            border: 1px solid #444;
            padding: 10px;
            box-sizing: border-box;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        .input-group input:focus {
            border-color: #d4af37;
            outline: none;
        }
        .submit-vip-btn {
            background: #d4af37;
            color: #111;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .submit-vip-btn:hover {
            background: #f3cd57;
        }
        @keyframes crash-anim {
            0% { background-color: #1a1a1a; filter: invert(0); }
            20% { background-color: #ff4b4b; filter: invert(1); }
            40% { background-color: #1a1a1a; }
            60% { background-color: #000; }
            100% { background-color: #1a1a1a; }
        }
        .crashing {
            animation: crash-anim 0.4s ease infinite;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

            </div>
            <div class="email-body">夢想開始的地方...

        </div>
        <button id="btnCheckPhone" class="action-btn" onclick="goToLineStage()"></button>

    <div id="stageLine" class="stage-container">
        <div class="phone-bg">
            <div id="txtLineTime" class="line-time"></div>
            <div class="line-msg-wrapper">
                <div id="txtLineAvatar" class="line-avatar"></div>
                <div class="line-chat-box">
                    <div id="txtLineName" class="line-name"></div>
                    <div id="txtLineBubble" class="line-bubble"></div>
                </div>

        <button id="btnClickScreen" class="action-btn" onclick="showMonologue()"></button>

    <div id="monologueOverlay" class="monologue-overlay">
        <div class="monologue-box">
            <p id="txtMonologue" class="monologue-text"></p>
            <button id="btnGoTo404" class="monologue-btn" onclick="triggerCrash()"></button>
        </div>
    </div>

    <div id="errorPage" class="error-container">
        <h1 id="txt404Head"></h1>
        <p id="txt404Sub"></p>
        <p id="txt2006Close" class="info-text"></p>
        <button id="bypassLiveBtn" class="hidden-trigger-btn" onclick="trigger2014Mode()"></button>
    </div>

        <div class="vip-title">ANCIENT CORE SYSTEM</div>
        <div id="txtVipSub" class="vip-subtitle"></div>
