<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢想開始的地方...</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ececec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* ----- 共通劇情容器 ----- */
        .stage-container {
            display: none;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }
        .active-stage {
            display: block;
        }

        /* 階段一：Email 樣式 */
        .email-box {
            background-color: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            font-family: monospace;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .email-header {
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #aaa;
            font-size: 14px;
            text-align: left;
        }
        .email-body {
            color: #00ff66;
            text-shadow: 0 0 5px rgba(0,255,102,0.3);
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
        }

        /* 階段二：手機 Line 樣式 */
        .phone-bg {
            background-color: #8c9bb0;
            border-radius: 20px;
            padding: 25px 15px;
            height: 450px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 4px solid #333;
            position: relative;
        }
        .line-time {
            align-self: center;
            background: rgba(0,0,0,0.1);
            color: #fff;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .line-msg-wrapper {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .line-avatar {
            width: 40px;
            height: 40px;
            background-color: #555;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
        }
        .line-chat-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .line-name {
            color: #fff;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .line-bubble {
            background-color: #fff;
            color: #1c1c1c;
            padding: 10px 14px;
            border-radius: 0 14px 14px 14px;
            font-size: 14px;
            max-width: 260px;
            line-height: 1.5;
            text-align: left;
            word-break: break-all;
        }

        /* 劇情按鈕 */
        .action-btn {
            background: #333;
            border: 1px solid #666;
            color: #fff;
            padding: 12px;
            width: 100%;
            font-size: 15px;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #444;
        }

        /* 透明內心獨白對話框樣式 */
        .monologue-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .monologue-box {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 12px;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            animation: fadeIn 0.4s ease;
        }
        .monologue-text {
            font-size: 16px;
            color: #e0e0e0;
            margin: 0 0 20px 0;
            line-height: 1.8;
            letter-spacing: 0.5px;
            text-align: left;
            white-space: pre-line;
        }
        .monologue-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #bbb;
            padding: 10px 25px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        .monologue-btn:hover {
            border-color: #ff4b4b;
            color: #ff4b4b;
        }

        /* ----- 404 障眼法畫面樣式 ----- */
        .error-container {
            display: none;
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }
        h1 {
            font-size: 72px;
            margin: 0 0 10px 0;
            color: #ff4b4b;
            letter-spacing: 2px;
        }
        p {
            font-size: 18px;
            color: #888;
            margin-bottom: 15px;
        }
        .info-text {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
        }
        .hidden-trigger-btn {
            display: none;
            margin-top: 50px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.12);
            font-size: 11px;
            cursor: pointer;
            outline: none;
        }
        .hidden-trigger-btn:hover {
            color: rgba(255, 255, 255, 0.35);
        }

        /* ----- 2014 模式主網站（古早豪門登入介面） ----- */
        #mainWebsite {
            display: none;
            background-color: #151518;
            border: 2px solid #d4af37; /* 帶有一點象徵有錢人的暗金色邊框 */
            padding: 40px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
            text-align: center;
        }
        .vip-title {
            color: #d4af37;
            font-family: "Times New Roman", serif;
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .vip-subtitle {
            color: #777;
            font-size: 12px;
            margin-bottom: 30px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            background-color: #222;
            border: 1px solid #444;
            padding: 10px;
            box-sizing: border-box;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        .input-group input:focus {
            border-color: #d4af37;
            outline: none;
        }
        .submit-vip-btn {
            background: #d4af37;
            color: #111;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .submit-vip-btn:hover {
            background: #f3cd57;
        }

        /* 閃爍崩潰特效 */
        @keyframes crash-anim {
            0% { background-color: #1a1a1a; filter: invert(0); }
            20% { background-color: #ff4b4b; filter: invert(1); }
            40% { background-color: #1a1a1a; }
            60% { background-color: #000; }
            100% { background-color: #1a1a1a; }
        }
        .crashing {
            animation: crash-anim 0.4s ease infinite;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- 階段一：一開始先顯示的神祕 Email -->
    <div id="stageEmail" class="stage-container active-stage">
        <div class="email-box">
            <div class="email-header">
                <strong>寄件人：</strong> ??? <br>
                <strong>主旨：</strong> 拜託看這封信
            </div>
            <div class="email-body">我是陳品僑
我沒有失蹤
是他們

拜託 你一定要看到
我已經沒有時間了
給404網址</div>
        </div>
        <button class="action-btn" onclick="goToLineStage()">查看手機</button>
    </div>

    <!-- 階段二：看著與他的 Line 最後對話 -->
    <div id="stageLine" class="stage-container">
        <div class="phone-bg">
            <div class="line-time">兩年前的某天</div>
            <div class="line-msg-wrapper">
                <div class="line-avatar">品僑</div>
                <div class="line-chat-box">
                    <div class="line-name">陳品僑</div>
                    <div class="line-bubble">接下來如果我失蹤了 不要找我 我也絕不會在這條訊息之後 傳任何訊息 email 給你 如果有 那絕對不是我</div>
                </div>
            </div>
        </div>
        <button class="action-btn" onclick="showMonologue()">點擊螢幕</button>
    </div>

    <!-- 透明內心獨白框（疊加在 Line 畫面上方） -->
    <div id="monologueOverlay" class="monologue-overlay">
        <div class="monologue-box">
            <p class="monologue-text">他已經失蹤了超過 2 年，他爸媽一直在找他，報了好多次警……

這個網站我記得，是一個很古早的 AI 對話網站。
那顆甚至算不上 AI，只是以前有錢人家用的。
進去的時候，會要求名字、電話、年齡……</p>
            <button class="monologue-btn" onclick="triggerCrash()">前往404網址</button>
        </div>
    </div>

    <!-- 階段三：崩潰後的 404 障眼法畫面 -->
    <div id="errorPage" class="error-container">
